[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sweettv-exam"
version = "0.1.0"
description = "Leakage-aware temporal TV recommendation experiments"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "pandas==2.3.3", "scikit-learn==1.6.1", "implicit==0.7.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
